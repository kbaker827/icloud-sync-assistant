name: Screenshots

# Renders README images (logo + app screenshots with demo data) on a real Mac.
# Download the "readme-images" artifact and commit its files to docs/images/.
on:
  workflow_dispatch:
  push:
    branches: ["docs/**"]

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Package app
        run: scripts/package-app.sh

      - name: Render logo
        run: |
          mkdir -p out
          swift scripts/make-icon.swift out/logo.png
          sips -z 256 256 out/logo.png --out out/logo-256.png >/dev/null

      - name: Capture screenshots
        run: |
          BIN="dist/iCloud Sync Assistant.app/Contents/MacOS/iCloudSyncAssistant"
          shoot() {
            ICSA_SCREENSHOT="$PWD/out/$1.png" ICSA_SCENARIO="$2" ICSA_APPEARANCE="$3" \
              ICSA_HEIGHT="$4" perl -e 'alarm shift; exec @ARGV' 120 "$BIN"
          }
          shoot dashboard-light good light 1480
          shoot dashboard-dark good dark 1480
          shoot needs-attention attention light 900
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-images
          path: out/*.png
          if-no-files-found: error
